<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Personalized Learning AI</title>
  </head>

  <body class="bg-slate-950">
    <div
      id="root"
      class="min-h-screen bg-slate-950"
    >
      <div
        id="app-loader"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #020617;
          color: white;
          font-family: Inter, system-ui, sans-serif;
        "
      >
        <div style="text-align: center;">
          <div
            style="
              width: 48px;
              height: 48px;
              margin: 0 auto 18px;
              border: 3px solid rgba(255,255,255,0.15);
              border-top-color: white;
              border-radius: 50%;
              animation: spin 0.8s linear infinite;
            "
          ></div>
          <div
            style="
              font-size: 18px;
              font-weight: 600;
              letter-spacing: -0.02em;
            "
          >
            Personalized Learning AI
          </div>
          <div
            style="
              margin-top: 8px;
              font-size: 13px;
              color: #64748b;
            "
          >
            Preparing your learning experience...
          </div>
        </div>
      </div>
    </div>

    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #020617;
      }

      body {
        min-height: 100vh;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
